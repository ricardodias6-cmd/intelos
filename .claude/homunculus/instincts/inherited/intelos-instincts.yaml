# Intelos Workflow Feature Development With Api And Tests

## Action

Follow the feature-development-with-api-and-tests workflow:
1. Define or update the feature contract/model (e.g., in evidence/auditable_models.py)
2. Implement the feature logic (e.g., in evidence/auditable_answer.py)
3. Expose the feature via an API endpoint (e.g., in api/routers/evidence.py)
4. Register the new API route (e.g., in api/main.py)
5. Write or update tests for the model/logic (e.g., in tests/test_auditable_answer_models.py, tests/test_auditable_answer.py)
6. Write or update tests for the API endpoint (e.g., in tests/test_evidence_answer_api.py)
7. Update CI workflows to include new tests (e.g., .github/workflows/evidence-core.yml)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: services/knowledge-engine/open_notebook/evidence/*.py, services/knowledge-engine/api/routers/*.py, services/knowledge-engine/api/main.py

