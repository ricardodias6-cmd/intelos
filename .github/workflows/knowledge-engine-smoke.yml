name: Knowledge engine smoke test

on:
  push:
    branches:
      - agent/import-validation
    paths:
      - .github/workflows/knowledge-engine-smoke.yml
      - services/knowledge-engine/**
  pull_request:
    paths:
      - .github/workflows/knowledge-engine-smoke.yml
      - services/knowledge-engine/**
  workflow_dispatch:

concurrency:
  group: knowledge-engine-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/knowledge-engine
    env:
      COMPOSE_PROJECT_NAME: intelos-smoke
      OPEN_NOTEBOOK_ENCRYPTION_KEY: smoke-test-encryption-key-not-for-production
      OPEN_NOTEBOOK_PASSWORD: smoke-test-password
      SURREAL_USER: smoke-user
      SURREAL_PASSWORD: smoke-surreal-password

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare disposable data directories
        run: |
          sudo rm -rf surreal_data notebook_data
          mkdir -p surreal_data notebook_data

      - name: Build application image
        run: docker compose build open_notebook

      - name: Start disposable stack
        run: docker compose up -d

      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 180); do
            if curl --fail --silent --show-error http://127.0.0.1:5055/health \
              | jq -e '.status == "healthy"' >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "API did not become healthy within the allowed time."
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Verify frontend and authentication
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8502/ >/dev/null

          curl --fail --silent --show-error http://127.0.0.1:5055/api/auth/status \
            | jq -e '.auth_enabled == true' >/dev/null

          unauthenticated_status=$(curl --silent --output /tmp/unauthenticated.json \
            --write-out '%{http_code}' http://127.0.0.1:5055/api/notebooks)
          test "$unauthenticated_status" = "401"

          wrong_password_status=$(curl --silent --output /tmp/wrong-password.json \
            --write-out '%{http_code}' \
            --header 'Authorization: Bearer wrong-password' \
            http://127.0.0.1:5055/api/notebooks)
          test "$wrong_password_status" = "401"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${OPEN_NOTEBOOK_PASSWORD}" \
            http://127.0.0.1:5055/api/notebooks \
            | jq -e 'type == "array"' >/dev/null

      - name: Create disposable record
        run: |
          smoke_name="Intelos smoke ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$smoke_name" > /tmp/smoke-notebook-name

          jq -n --arg name "$smoke_name" \
            '{name: $name, description: "Disposable persistence smoke test"}' \
            > /tmp/create-notebook.json

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${OPEN_NOTEBOOK_PASSWORD}" \
            --header 'Content-Type: application/json' \
            --data @/tmp/create-notebook.json \
            http://127.0.0.1:5055/api/notebooks \
            | tee /tmp/created-notebook.json \
            | jq -e --arg expected "$smoke_name" \
                '.id != "" and .name == $expected' >/dev/null

      - name: Restart full stack
        run: |
          docker compose down
          docker compose up -d

          for attempt in $(seq 1 180); do
            if curl --fail --silent --show-error http://127.0.0.1:5055/health \
              | jq -e '.status == "healthy"' >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "API did not recover after the full stack restart."
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Verify persisted record after restart
        run: |
          smoke_name=$(cat /tmp/smoke-notebook-name)

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${OPEN_NOTEBOOK_PASSWORD}" \
            http://127.0.0.1:5055/api/notebooks \
            | jq -e --arg expected "$smoke_name" \
                'any(.[]; .name == $expected)' >/dev/null

          test -n "$(find surreal_data -mindepth 1 -print -quit)"

      - name: Record runtime observations
        if: always()
        run: |
          {
            echo '# Knowledge engine smoke test'
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}"
            echo
            echo '## Container state'
            echo '```'
            docker compose ps || true
            echo '```'
            echo
            echo '## Configured container users'
            echo '```'
            for container in $(docker compose ps -q 2>/dev/null); do
              name=$(docker inspect --format '{{.Name}}' "$container" | sed 's#^/##')
              user=$(docker inspect --format '{{if .Config.User}}{{.Config.User}}{{else}}root (implicit){{end}}' "$container")
              printf '%s: %s\n' "$name" "$user"
            done
            echo '```'
          } > smoke-test-report.md

          docker compose logs --no-color > smoke-compose.log 2>&1 || true

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-engine-smoke-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            services/knowledge-engine/smoke-test-report.md
            services/knowledge-engine/smoke-compose.log

      - name: Clean up disposable stack
        if: always()
        run: |
          docker compose down --remove-orphans || true
          sudo rm -rf surreal_data notebook_data
