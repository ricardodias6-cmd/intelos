name: Targeted dependency refresh

on:
  pull_request:
    branches:
      - agent/import-open-notebook
    paths:
      - .github/workflows/targeted-dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v6
        with:
          ref: agent/import-validation

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: services/knowledge-engine/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/knowledge-engine/frontend/package-lock.json

      - name: Apply minimum Python security constraints
        working-directory: services/knowledge-engine
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text()
          old = 'override-dependencies = ["pillow>=12.2.0"]'
          new = '''override-dependencies = [
              "pillow>=12.2.0",
              "click>=8.3.3",
              "lxml-html-clean>=0.4.5",
              "pyasn1>=0.6.4",
          ]'''
          if old not in text:
              raise SystemExit("Expected override-dependencies line was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          uv lock \
            --upgrade-package 'click==8.3.3' \
            --upgrade-package 'lxml-html-clean==0.4.5' \
            --upgrade-package 'pyasn1==0.6.4'
          uv sync --frozen --group dev
          uv run ruff check api commands open_notebook tests run_api.py
          uv run pytest -q

      - name: Audit refreshed Python environment
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          virtual-environment: services/knowledge-engine/.venv/

      - name: Apply and validate minimum npm security updates
        working-directory: services/knowledge-engine/frontend
        run: |
          npm install --package-lock-only --ignore-scripts next@16.2.11
          npm pkg set 'overrides.postcss=8.5.18'
          npm pkg set 'overrides.sharp=0.35.0'
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run lint
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high --json > npm-audit-final.json

      - name: Capture targeted diff
        run: |
          git diff -- \
            services/knowledge-engine/pyproject.toml \
            services/knowledge-engine/uv.lock \
            services/knowledge-engine/frontend/package.json \
            services/knowledge-engine/frontend/package-lock.json \
            > targeted-dependency-refresh.diff
          git diff --stat > targeted-dependency-refresh.stat

      - name: Upload refreshed dependency files
        uses: actions/upload-artifact@v4
        with:
          name: targeted-dependency-refresh
          if-no-files-found: error
          path: |
            services/knowledge-engine/pyproject.toml
            services/knowledge-engine/uv.lock
            services/knowledge-engine/frontend/package.json
            services/knowledge-engine/frontend/package-lock.json
            services/knowledge-engine/frontend/npm-audit-final.json
            targeted-dependency-refresh.diff
            targeted-dependency-refresh.stat

      - name: Commit targeted dependency fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/knowledge-engine/pyproject.toml \
            services/knowledge-engine/uv.lock \
            services/knowledge-engine/frontend/package.json \
            services/knowledge-engine/frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "security: apply minimum dependency fixes"
          git push origin HEAD:agent/import-validation
