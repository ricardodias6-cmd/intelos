name: Evidence Core autofix

on:
  push:
    branches:
      - agent/evidence-core-foundation
    paths:
      - .github/workflows/evidence-core-autofix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/knowledge-engine

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/evidence-core-foundation

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Apply fixes and capture diagnostics
        shell: bash
        run: |
          uv run ruff check --fix \
            open_notebook/evidence \
            open_notebook/domain/evidence.py \
            open_notebook/graphs/source.py \
            tests/test_evidence_core.py \
            tests/test_docling_evidence_adapter.py \
            > ../../ruff-diagnostics.txt 2>&1 || true

      - name: Commit fixes and diagnostics
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/knowledge-engine/open_notebook/evidence \
                  services/knowledge-engine/open_notebook/domain/evidence.py \
                  services/knowledge-engine/open_notebook/graphs/source.py \
                  services/knowledge-engine/tests/test_evidence_core.py \
                  services/knowledge-engine/tests/test_docling_evidence_adapter.py \
                  ruff-diagnostics.txt
          git commit -m 'chore: capture Evidence Core lint diagnostics'
          git push origin HEAD:agent/evidence-core-foundation
